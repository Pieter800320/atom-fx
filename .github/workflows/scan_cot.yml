name: "Weekly COT Scan"
on:
  workflow_dispatch:
permissions:
  contents: write
# 2026-09-09 (Pieter's ask) — native `schedule:` cron removed; see scan_h1.yml's own comment for
# why (same duplicate-dispatch mechanism against the Apps Script scheduler, same fix here).
# Apps Script is now the sole scheduler; workflow_dispatch stays for it and for manual runs.
# Queue overlapping triggers instead of racing on the "Commit data" step's git push (a manual
# dispatch landing mid-scan is still possible) -- cancel-in-progress: false, never kill a scan
# mid-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scan_cot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: pip install -r push/requirements-push.txt
      - name: Run weekly COT/Conviction scan
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python -m scanner.scan_cot
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git add data/signals.json
          git diff --cached --quiet || git commit -m "chore: weekly COT scan"
          git push
