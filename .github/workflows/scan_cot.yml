name: "Weekly COT Scan"
on:
  schedule:
    - cron: '0 12 * * 6'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan_cot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: pip install -r push/requirements-push.txt
      - name: Run weekly COT/Conviction scan
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python -m scanner.scan_cot
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git add data/signals.json
          git diff --cached --quiet || git commit -m "chore: weekly COT scan"
          git push
