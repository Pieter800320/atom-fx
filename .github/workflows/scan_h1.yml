name: "Hourly Scan"
on:
  workflow_dispatch:
permissions:
  contents: write
# 2026-09-09 (Pieter's ask) — native `schedule:` cron removed. It targeted the exact same hours
# as the external Apps Script scheduler (see the script's own header comment), so every scheduled
# slot double-dispatched this workflow: the native cron and the Apps Script hourly trigger both
# fired for the same UTC hour, queuing two full 18-call TwelveData fetch cycles back-to-back
# instead of ~2h apart. That queueing (not true concurrency, thanks to the block below) is what
# let the scanner's own 6/min self-throttle blow past Twelvedata's account-wide 8-credit/min cap
# so fast: run 2 started fetching within seconds of run 1's last call, no cooldown between them.
# Apps Script is now the sole scheduler; workflow_dispatch stays for it and for manual runs.
# Queue overlapping triggers instead of racing on the "Commit data" step's git push (a manual
# dispatch landing mid-scan is still possible) -- cancel-in-progress: false, never kill a scan
# mid-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - run: pip install -r push/requirements-push.txt
      - name: Restore the H1 history from the private Actions cache
        # Twelve Data's terms bar redistributing raw data, so the hourly store is NOT committed to this public repo. A per-run key with a prefix
        # restore-key always restores the newest cache and saves a fresh one at the end of a successful run. Empty/evicted cache = cold start:
        # scan_h1 backfills once (12 extra API calls) via scanner/extend/h1_backfill.py.
        uses: actions/cache@v4
        with:
          path: data/h1_history
          key: h1-history-${{ github.run_id }}
          restore-keys: |
            h1-history-
      - name: Run hourly scan
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
        run: python -m scanner.scan_h1
      - name: Commit data
        # 2026-09-10 — the previous stash/rebase/stash-pop dance silently corrupted
        # data/signals.json in production: scan_h1 and scan_news aren't in the same
        # concurrency group, so they CAN run close together; when both touched this file,
        # `git stash pop || true` hit a real conflict, the `|| true` swallowed the failure,
        # and the literal `<<<<<<< Updated upstream` / `>>>>>>> Stashed changes` markers got
        # `git add`ed and pushed as valid JSON — breaking every client's parse. This file is
        # fully regenerated every run (never hand-edited), so there is nothing to preserve on
        # a conflict: commit our own fresh output first, then rebase onto whatever else
        # landed on main since checkout, resolving any per-hunk conflict in favour of THIS
        # run's own just-computed commit (`-X theirs` — during a rebase the side being
        # replayed, i.e. our own commit, is "theirs"; `-X ours` would keep the OLDER upstream
        # side instead, the opposite of what we want here — confirmed 2026-09-17, the original
        # 2026-09-10 fix had this backwards) rather than trying to hand-merge two scan
        # snapshots. No stash, no silent failure path.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "chore: h1 scan"
          git pull --rebase -X theirs origin main
          git push