name: "Hourly Scan"
on:
  schedule:
    - cron: '5 5,7,9,11,13,15,17,19 * * 1-5'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Run hourly scan
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
        run: python -m scanner.scan_h1
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git stash || true
          git pull --rebase origin main
          git stash pop || true
          git add data/
          git diff --cached --quiet || git commit -m "chore: h1 scan"
          git push