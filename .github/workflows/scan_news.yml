name: "News Scan"
on:
  workflow_dispatch:
permissions:
  contents: write
# 2026-09-09 (Pieter's ask) — native `schedule:` cron removed; see scan_h1.yml's own comment for
# why (same duplicate-dispatch mechanism against the Apps Script scheduler, same fix here).
# Apps Script is now the sole scheduler; workflow_dispatch stays for it and for manual runs.
# Queue overlapping triggers instead of racing on the "Commit data" step's git push (a manual
# dispatch landing mid-scan is still possible) -- cancel-in-progress: false, never kill a scan
# mid-write.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
jobs:
  scan_news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements.txt
      - name: Run news scan
        env:
          TWELVEDATA_KEY: ${{ secrets.TWELVEDATA_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m scanner.scan_news
      - name: Commit data
        # 2026-09-10 — see scan_h1.yml's own comment: the stash/rebase/stash-pop dance could
        # silently commit unresolved git conflict markers as if they were valid JSON when
        # this workflow raced scan_h1's. Commit our own fresh output first, then rebase
        # resolving any conflict on our own side (-X ours) — no stash, no silent failure path.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/signals.json
          git diff --cached --quiet || git commit -m "chore: news scan"
          git pull --rebase -X ours origin main
          git push