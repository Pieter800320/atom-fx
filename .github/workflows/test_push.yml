name: "Test Push"
on:
  workflow_dispatch:
jobs:
  test_push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r push/requirements-push.txt
      - name: Send test push
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
        run: python -m push.send_push